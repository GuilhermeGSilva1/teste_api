<!DOCTYPE html> <!-- Declara que o documento segue o padrão HTML 5 -->
<html lang="pt-BR"> <!-- Define que o idioma principal da página é Português do Brasil -->
    <head> <!-- Cabeçalho do documento contendo metadados e links externos -->

        <meta charset="UTF-8"> <!-- Define a codificação de caracteres UTF-8 para permitir acentos e caracteres especiais -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Garante que a página seja responsiva em diferentes tamanhos de tela -->

        <title>Tarefas App</title> <!-- Define o título que aparece na aba do navegador -->

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"> <!-- Importa o Bootstrap para utilizar estilos prontos -->

    </head> <!-- Fecha o cabeçalho do documento -->


    <body> <!-- Inicia o conteúdo que será exibido na página -->


        <div class="d-flex justify-content-center"> <!-- Cria uma div e centraliza o conteúdo horizontalmente -->
            <div class="spinner-border" role="status" id="loading"> <!-- Cria um indicador de carregamento do Bootstrap -->
                <span class="sr-only"></span> <!-- Elemento utilizado para informações destinadas a leitores de tela -->
            </div> <!-- Fecha o indicador de carregamento -->
        </div> <!-- Fecha a div responsável por centralizar o carregamento -->


        <p class="h1 text-center">Tarefas de um Usuário</p> <!-- Exibe o título da página centralizado -->


        <table class="table table-hover" id="tasks"> <!-- Cria uma tabela com estilos do Bootstrap -->
        </table> <!-- Fecha a tabela onde as tarefas serão exibidas -->


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script> <!-- Importa o JavaScript do Bootstrap -->
        <script src="script.js"></script> <!-- Importa o arquivo JavaScript responsável pelas funções da página -->


    </body> <!-- Fecha o conteúdo principal da página -->
</html> <!-- Fecha o documento HTML -->
